plugins {
    id "net.fabricmc.fabric-loom-remap" version "${legacy_fabric_loom_version}"
}

version = project.mod_version
group = project.maven_group

base {
    archivesName = "mc-auto-translation-tool-fabric-${minecraft_1_16_5_version}"
}

dependencies {
    minecraft "com.mojang:minecraft:${minecraft_1_16_5_version}"
    mappings "net.fabricmc:yarn:${yarn_1_16_5_mappings}:v2"
    modImplementation "net.fabricmc:fabric-loader:${loader_1_16_5_version}"
    modImplementation "net.fabricmc.fabric-api:fabric-api:${fabric_api_1_16_5_version}"
}

sourceSets {
    main {
        java.srcDir project(":translator-core").file("src/main/java")
    }
}

// 1.16.5 只有合并 jar，客户端代码与核心共用 main 源集
loom {
    mods {
        "universal_translator" {
            sourceSet sourceSets.main
        }
    }
}

tasks.register("styledChatSelfTest", JavaExec) {
    group = "verification"
    description = "Checks chat style and interaction attachment preservation."
    dependsOn(tasks.named("testClasses"))
    classpath = sourceSets.test.runtimeClasspath
    mainClass = "org.universaltranslator.fabric.StyledChatTextSelfTest"
}

tasks.named("test") {
    failOnNoDiscoveredTests = false
}

tasks.named("check") {
    dependsOn(tasks.named("styledChatSelfTest"))
}

processResources {
    inputs.property "version", project.version
    filesMatching("fabric.mod.json") {
        expand "version": project.version
    }
}

tasks.withType(JavaCompile).configureEach {
    options.encoding = "UTF-8"
    options.release = 8
}

// 1.16.5 的 Mixin 0.8.7 读不了高版本类文件，运行必须用 Java 8
def java8Launcher = javaToolchains.launcherFor {
    languageVersion = JavaLanguageVersion.of(8)
}
tasks.matching { it.name == "runClient" || it.name == "runServer" }.configureEach {
    if (it.hasProperty("javaLauncher") && java8Launcher.isPresent()) {
        it.javaLauncher.set(java8Launcher)
    }
}

java {
    withSourcesJar()
}

jar {
    from(rootProject.file("LICENSE")) {
        rename { "LICENSE_universal_translator" }
    }
    from(rootProject.file("docs/en/THIRD_PARTY_OFFLINE.md")) {
        rename { "THIRD_PARTY_OFFLINE.md" }
    }
}
