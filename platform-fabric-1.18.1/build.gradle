plugins {
    id "net.fabricmc.fabric-loom-remap" version "${loom_1_18_1_version}"
}

version = project.mod_version
group = project.maven_group

base {
    archivesName = "mc-auto-translation-tool-fabric-${minecraft_1_18_1_version}"
}

dependencies {
    minecraft "com.mojang:minecraft:${minecraft_1_18_1_version}"
    mappings "net.fabricmc:yarn:${yarn_1_18_1_mappings}:v2"
    modImplementation "net.fabricmc:fabric-loader:${loader_1_18_1_version}"
    modImplementation "net.fabricmc.fabric-api:fabric-api:${fabric_api_1_18_1_version}"
}

sourceSets {
    main {
        java.srcDir project(":translator-core").file("src/main/java")
    }
}

// 1.18.1 使用合并类路径，客户端代码与核心共用 main 源集
loom {
    mods {
        "universal_translator" {
            sourceSet sourceSets.main
        }
    }
}

processResources {
    inputs.property "version", project.version
    filesMatching("fabric.mod.json") {
        expand "version": project.version
    }
}

tasks.register("styledChatSelfTest", JavaExec) {
    group = "verification"
    description = "Checks chat style and interaction attachment preservation."
    dependsOn(tasks.named("testClasses"))
    classpath = sourceSets.test.runtimeClasspath
    mainClass = "org.universaltranslator.fabric.StyledChatTextSelfTest"
}

tasks.named("test") {
    failOnNoDiscoveredTests = false
}

tasks.named("check") {
    dependsOn(tasks.named("styledChatSelfTest"))
}

tasks.withType(JavaCompile).configureEach {
    options.encoding = "UTF-8"
    // 1.18.1 运行于 Java 17
    options.release = 17
    options.compilerArgs << "-Xmaxerrs" << "2000"
}

java {
    withSourcesJar()
}

jar {
    from(rootProject.file("LICENSE")) {
        rename { "LICENSE_universal_translator" }
    }
    from(rootProject.file("docs/en/THIRD_PARTY_OFFLINE.md")) {
        rename { "THIRD_PARTY_OFFLINE.md" }
    }
}
