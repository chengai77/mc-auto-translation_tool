plugins { id "architectury-plugin" version "3.5.170"; id "dev.architectury.loom-no-remap" version "1.17.493" }
version = project.mod_version; group = project.maven_group
base { archivesName = "mc-auto-translation-tool-forge-${minecraft_26_2_version}" }
java { toolchain { languageVersion = JavaLanguageVersion.of(25) }; withSourcesJar() }
loom { silentMojangMappingsLicense(); mods { "universal_translator" { sourceSet sourceSets.main } }; forge { mixinConfig "universal-translator.forge.mixins.json" } }
architectury { platformSetupLoomIde(); forge() }
sourceSets { main { java { srcDir rootProject.file("../translator-core/src/main/java") } } }
dependencies { minecraft "com.mojang:minecraft:${minecraft_26_2_version}"; forge "net.minecraftforge:forge:${forge_26_2_version}" }
processResources { inputs.property "version", project.version; filesMatching("META-INF/mods.toml") { expand version: project.version } }
tasks.withType(JavaCompile).configureEach { options.encoding = "UTF-8"; options.release = 25 }
jar {
    duplicatesStrategy = DuplicatesStrategy.EXCLUDE
    from(rootProject.file("../LICENSE")) {
        rename { "LICENSE_universal_translator" }
    }
    from(rootProject.file("../docs/en/THIRD_PARTY_OFFLINE.md")) {
        rename { "THIRD_PARTY_OFFLINE.md" }
    }
}
