plugins { id "architectury-plugin" version "3.4.162"; id "dev.architectury.loom" version "1.13.467" }
version = project.mod_version; group = project.maven_group
base { archivesName = "mc-auto-translation-tool-neoforge-1.21.4" }
repositories { maven { url = "https://maven.neoforged.net/releases/" } }
java { toolchain { languageVersion = JavaLanguageVersion.of(21) }; withSourcesJar() }
loom { silentMojangMappingsLicense(); mods { "universal_translator" { sourceSet sourceSets.main } } }
architectury { platformSetupLoomIde(); neoForge() }
sourceSets { main { java { srcDir rootProject.file("../translator-core/src/main/java") } } }
dependencies {
    minecraft "com.mojang:minecraft:${minecraft_1_21_4_version}"
    mappings loom.layered {
        mappings("net.fabricmc:yarn:${yarn_1_21_4_mappings}:v2")
        mappings("dev.architectury:yarn-mappings-patch-neoforge:${neoforge_1_21_yarn_patch}")
    }
    neoForge "net.neoforged:neoforge:${neoforge_1_21_4_version}"
}
processResources { inputs.property "version", project.version; filesMatching("META-INF/neoforge.mods.toml") { expand version: project.version } }
tasks.withType(JavaCompile).configureEach { options.encoding = "UTF-8"; options.release = 21 }
jar {
    duplicatesStrategy = DuplicatesStrategy.EXCLUDE
    from(rootProject.file("../LICENSE")) {
        rename { "LICENSE_universal_translator" }
    }
    from(rootProject.file("../docs/en/THIRD_PARTY_OFFLINE.md")) {
        rename { "THIRD_PARTY_OFFLINE.md" }
    }
}
